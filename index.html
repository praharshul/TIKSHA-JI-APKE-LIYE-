<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      text-align: center;
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-top: 50px;
      animation: fadeIn 2s ease-in-out;
    }

    .para {
      font-size: 1.2rem;
      width: 85%;
      max-width: 700px;
      margin: 20px auto;
      line-height: 1.8;
      padding: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      font-style: italic;
      animation: fadeIn 3s ease-in-out;
    }

    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .gallery img {
      width: 180px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .gallery img:hover {
      transform: scale(1.15);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }

    .heart-btn {
      margin: 50px auto;
      font-size: 60px;
      background: none;
      border: none;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    .heart-btn:hover {
      transform: scale(1.2);
    }

    /* Floating Hearts */
    .heart {
      position: fixed;
      bottom: -10px;
      color: red;
      font-size: 24px;
      animation: floatUp 6s infinite ease-in;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>For My Dearest ❤️ Tiksha</h1>

  <div class="para">
    Every heartbeat of mine whispers your name, every smile I wear is because of you.  
    You are my home, my dream, and my forever.  
    No matter how much the world changes, one truth will never fade —  
    <b>I love you endlessly ❤️</b>
  </div>

  <div class="gallery">
    <img src="IMG_7628.jpeg" alt="Us 1">
    <img src="IMG_7629.jpeg" alt="Us 2">
    <img src="IMG_7630.jpeg" alt="Us 3">
  </div>

  <!-- Big Heart Button to Go to Next Page -->
  <button class="heart-btn" onclick="window.location.href='valentine.html'">❤️</button>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 600);
  </script>
</body>
</html>
